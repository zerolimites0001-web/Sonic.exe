name: Build Sonic.exe APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk sonic.exe.apk && ls -lh sonic.exe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-exe
          path: sonic.exe.apk
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sonic.exe v1.0.${{ github.run_number }}
          files: sonic.exe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
